<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netra Admin Prototype</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial; margin: 0; background: #0b1020; color: #e6eef9; }
    header { padding: 12px 16px; background: #0f1530; border-bottom: 1px solid #1e2752; display: flex; align-items: center; justify-content: space-between; }
    .pill { padding: 4px 8px; background: #1b2450; border: 1px solid #2a377c; border-radius: 999px; font-size: 12px; color: #9fb4ff; }
    main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; }
    section { background: #0f1530; border: 1px solid #1e2752; border-radius: 12px; overflow: hidden; }
    h2 { font-size: 14px; margin: 0; padding: 10px 12px; color: #9fb4ff; border-bottom: 1px solid #1e2752; }
    .content { padding: 12px; }
    button { background: #2a377c; color: #e6eef9; border: 1px solid #3b52a1; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #334395; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #1e2752; padding: 8px; font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    input, select { background: #0b1020; color: #e6eef9; border: 1px solid #1e2752; padding: 6px 8px; border-radius: 8px; }
    .ok { color: #7dffa5; }
  </style>
</head>
<body>
  <header>
    <div><strong>Netra</strong> <span class="pill">Admin Prototype</span></div>
    <div id="health" class="pill">health: unknown</div>
  </header>
  <main>
    <section>
      <h2>Cameras</h2>
      <div class="content">
        <div class="row">
          <input id="cam-name" placeholder="Name" />
          <input id="cam-lat" placeholder="Lat" type="number" step="0.000001" />
          <input id="cam-lon" placeholder="Lon" type="number" step="0.000001" />
          <button onclick="createCamera()">Add</button>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Lat</th><th>Lon</th><th>FPS</th></tr></thead>
          <tbody id="cams"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Signal Control</h2>
      <div class="content">
        <div class="row">
          <input id="junction-id" placeholder="Junction ID" size="36" />
          <select id="mode">
            <option value="ai">AI</option>
            <option value="scheduled">Scheduled</option>
            <option value="manual">Manual</option>
          </select>
          <button onclick="setMode()">Set mode</button>
        </div>
        <div class="row">
          <input id="phase" placeholder="Phase e.g. G/Y/R" />
          <input id="duration" type="number" placeholder="Seconds" value="30" />
          <button onclick="applyPhase()">Apply phase</button>
        </div>
        <div class="row">
          <button onclick="refreshState()">Refresh state</button>
          <span id="state"></span>
        </div>
      </div>
    </section>

    <section>
      <h2>Violations / Challans</h2>
      <div class="content">
        <div class="row">
          <button onclick="seedViolation()">Seed Violation</button>
          <button onclick="listPending()">Reload Pending</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Type</th><th>Confidence</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="violations"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const API = (path) => (location.origin.includes(':') ? `http://localhost:8000${path}` : `${location.origin}${path}`);

    async function pingHealth() {
      try {
        const res = await fetch(API('/healthz'));
        const data = await res.json();
        document.getElementById('health').textContent = `health: ${data.status}`;
        document.getElementById('health').classList.add('ok');
      } catch (e) {
        document.getElementById('health').textContent = 'health: offline';
      }
    }

    async function loadCameras() {
      const res = await fetch(API('/admin/cameras'));
      const items = await res.json();
      const tbody = document.getElementById('cams');
      tbody.innerHTML = '';
      items.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${c.name}</td><td>${c.lat ?? ''}</td><td>${c.lon ?? ''}</td><td>${c.fps ?? ''}</td>`;
        tbody.appendChild(tr);
      });
      const jInput = document.getElementById('junction-id');
      if (items.length && !jInput.value) jInput.value = items[0].junctionId;
    }

    async function createCamera() {
      const name = document.getElementById('cam-name').value || 'Cam-New';
      const lat = parseFloat(document.getElementById('cam-lat').value || '0');
      const lon = parseFloat(document.getElementById('cam-lon').value || '0');
      const junctionId = document.getElementById('junction-id').value || crypto.randomUUID();
      await fetch(API('/admin/camera'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, lat, lon, junctionId }) });
      loadCameras();
    }

    async function setMode() {
      const j = document.getElementById('junction-id').value;
      const mode = document.getElementById('mode').value;
      await fetch(API(`/signal/${j}/mode`), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mode }) });
      refreshState();
    }

    async function applyPhase() {
      const j = document.getElementById('junction-id').value;
      const phase = document.getElementById('phase').value || 'G';
      const durationSeconds = parseInt(document.getElementById('duration').value || '30');
      await fetch(API(`/signal/${j}/set-phase`), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phase, durationSeconds }) });
      refreshState();
    }

    async function refreshState() {
      const j = document.getElementById('junction-id').value;
      const res = await fetch(API(`/signal/${j}/state`));
      const st = await res.json();
      document.getElementById('state').textContent = `phase=${st.phase}, source=${st.source}, duration=${st.duration}s`;
    }

    async function seedViolation() {
      const violation = { cameraId: crypto.randomUUID(), type: 'red_light', confidence: 0.95 };
      await fetch(API('/ingest/edge-event'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ violations: [violation] }) });
      listPending();
    }

    async function listPending() {
      const res = await fetch(API('/challans/pending'));
      const data = await res.json();
      const tbody = document.getElementById('violations');
      tbody.innerHTML = '';
      (data.items || []).forEach(v => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${v.id}</td><td>${v.type}</td><td>${v.confidence}</td><td>${v.status}</td><td><button data-id="${v.id}">Issue</button></td>`;
        tr.querySelector('button').onclick = async () => {
          const vehicleNumber = prompt('Vehicle number?');
          if (!vehicleNumber) return;
          await fetch(API('/challans/create'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ violationId: v.id, vehicleNumber, fine: 500 }) });
          listPending();
        };
        tbody.appendChild(tr);
      });
    }

    pingHealth();
    loadCameras();
    listPending();
  </script>
</body>
</html>
